<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GarageTEC</title>
<style>
  :root {
    --bg: #0a0d0b;
    --fg: #e7eee9;
    --muted: #8b978f;
    --green: #79bc30;
    --line: #242c27;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(120% 80% at 50% 35%, #10160f 0%, var(--bg) 60%) fixed,
      var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  .mark {
    position: relative;
    width: 132px;
    height: 132px;
    display: grid;
    place-items: center;
  }
  /* soft green halo that breathes behind the logo */
  .mark::before {
    content: "";
    position: absolute;
    inset: -28%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(121,188,48,0.30) 0%, rgba(121,188,48,0) 68%);
    animation: halo 2.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
  }
  .mark img {
    width: 132px;
    height: 132px;
    object-fit: contain;
    border-radius: 26px;
    animation: breathe 2.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
  }

  .wordmark {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--fg);
    padding-left: 0.42em; /* optical centering for the tracked text */
  }
  .wordmark b { color: var(--green); font-weight: 600; }

  .track {
    position: relative;
    width: 220px;
    height: 3px;
    border-radius: 999px;
    background: var(--line);
    overflow: hidden;
  }
  .track::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(121,188,48,0) 0%, var(--green) 50%, rgba(121,188,48,0) 100%);
    animation: slide 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }

  .status {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
    min-height: 1em;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  @keyframes halo {
    0%, 100% { opacity: 0.45; transform: scale(0.96); }
    50% { opacity: 1; transform: scale(1.06); }
  }
  @keyframes slide {
    0% { left: -45%; }
    100% { left: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .mark img, .mark::before, .track::after { animation: none; }
    .track::after { left: 0; width: 100%; opacity: 0.6; }
  }
</style>
</head>
<body>
  <div class="mark"><img src="garagetec-icon.png" alt="GarageTEC" /></div>
  <div class="wordmark">Garage<b>TEC</b></div>
  <div class="track"></div>
  <div class="status">Warming up the bay&hellip;</div>
</body>
</html>
